name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "dvc[s3]"

      - name: Configure DagsHub credentials
        run: |
          dvc remote modify origin --local access_key_id ${{ secrets.DAGSHUB_TOKEN }}
          dvc remote modify origin --local secret_access_key ${{ secrets.DAGSHUB_TOKEN }}

      - name: Pull data from DagsHub
        run: |
          dvc pull

      - name: Run DVC pipeline
        run: |
          dvc repro

      - name: Smoke test Streamlit app
        run: |
          streamlit run streamlit_app/app.py --server.headless true --server.port 8501 &
          sleep 10
          curl --fail http://localhost:8501/_stcore/health

    